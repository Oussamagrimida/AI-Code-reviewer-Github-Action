name: 'AI Code Reviewer'
description: 'Automatically reviews pull requests using NVIDIA Nemotron, with an optional auto-fix step.'
author: 'Grimida Oussama'

inputs:
  nvidia-api-key:
    description: 'NVIDIA API key (get a free one at build.nvidia.com)'
    required: true
  github-token:
    description: 'Token used to post the review. Defaults to the automatic GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  enable-autofix:
    description: >
      If "true", attempts to automatically fix flagged bugs/security
      issues and pushes the fix as a new commit on the PR branch. Off by
      default -- only works for PRs from branches in the same repo (not
      forks).
    required: false
    default: 'false'
  test-command:
    description: >
      Trusted JSON argv array for the project's tests, for example
      ["python", "-m", "pytest", "-q"]. No shell is used. When omitted,
      auto-fix operates in Mode 2 with basic deterministic syntax validation.
    required: false
    default: ''
  allow-unverified-push:
    description: >
      If "true" and no test-command is configured, allows committing and
      pushing fixes that pass basic deterministic validation (e.g. language
      syntax checks). Defaults to "false".
    required: false
    default: 'false'
  max-fix-attempts:
    description: 'Maximum number of fix-and-test attempts (1-5; default 2).'
    required: false
    default: '2'


runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install review dependencies
      shell: bash
      run: python -m pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Run AI review
      id: review
      shell: bash
      run: python "${{ github.action_path }}/review.py"
      env:
        NVIDIA_API_KEY: ${{ inputs.nvidia-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        ENABLE_MULTI_PASS: 'true'

    - name: Install auto-fix dependencies
      if: inputs.enable-autofix == 'true' && steps.review.outputs.has_bugs == 'true'
      shell: bash
      run: python -m pip install -r "${{ github.action_path }}/requirements-autofix.txt"

    - name: Run auto-fix
      if: inputs.enable-autofix == 'true' && steps.review.outputs.has_bugs == 'true'
      shell: bash
      run: python "${{ github.action_path }}/fixer.py"
      working-directory: ${{ github.workspace }}
      env:
        NVIDIA_API_KEY: ${{ inputs.nvidia-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        REVIEW_FINDINGS_JSON: ${{ steps.review.outputs.autofix_findings }}
        AUTOFIX_TEST_COMMAND: ${{ inputs.test-command }}
        AUTOFIX_MAX_ATTEMPTS: ${{ inputs.max-fix-attempts }}
        AUTOFIX_ALLOW_UNVERIFIED_PUSH: ${{ inputs.allow-unverified-push }}


branding:
  icon: 'eye'
  color: 'yellow'
